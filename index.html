<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QuickNotes API client for creating, loading, and deleting notes."
    />
    <title>QuickNotes - API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>A simple notes app powered by an API.</p>
    </header>

    <main>
      <section aria-labelledby="notes-heading">
        <h2 id="notes-heading">Your notes</h2>

        <button id="load-btn" type="button">Load notes</button>

        <p id="status" role="status" aria-live="polite">
          Click "Load notes" to fetch notes from the server.
        </p>

        <ul id="notes-list"></ul>
      </section>

      <section aria-labelledby="create-heading">
        <h2 id="create-heading">Create a note</h2>

        <form id="note-form">
          <div class="form-group">
            <label for="title-input"
              >Title (required, max 100 characters)</label
            >
            <input
              id="title-input"
              name="title"
              type="text"
              maxlength="100"
              required
            />
          </div>

          <div class="form-group">
            <label for="body-input">Note body (optional)</label>
            <textarea id="body-input" name="body" rows="5"></textarea>
          </div>

          <button id="submit-btn" type="submit">Create note</button>
        </form>
      </section>
    </main>

    <footer>
      <p>QuickNotes System Design Project</p>
    </footer>
  </body>
</html>
